<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning MCP Resource Manager</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --line: #d5deea;
      --line-strong: #b8c7d9;
      --text: #0f172a;
      --muted: #5b6b82;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #15996b;
      --warning: #b7791f;
      --danger: #dc2626;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      max-width: 1420px;
      margin: 0 auto;
      padding: 28px 28px 32px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 780;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .status-card {
      min-width: 280px;
      max-width: 520px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warning);
    }

    .dot.online {
      background: var(--success);
    }

    .status-detail {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-all;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 430px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 140px 96px;
      gap: 10px;
      width: min(620px, 100%);
    }

    .field,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .field,
    .select {
      height: 42px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 86px;
      resize: vertical;
      padding: 11px 12px;
      line-height: 1.55;
    }

    .field:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .btn {
      height: 42px;
      border-radius: 8px;
      padding: 0 14px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line-strong);
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn.danger {
      border-color: #fecaca;
      color: var(--danger);
      background: #fffafa;
    }

    .btn.ghost {
      background: transparent;
    }

    .resource-list {
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 210px);
      min-height: 520px;
      overflow: auto;
      padding: 14px;
    }

    .resource-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .resource-card.active {
      border-color: rgba(37, 99, 235, 0.72);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .resource-main {
      min-width: 0;
    }

    .resource-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .resource-title strong {
      font-size: 17px;
      line-height: 1.35;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 12px;
      font-weight: 760;
    }

    .resource-id {
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 13px;
    }

    .resource-text {
      margin: 8px 0 0;
      color: #223047;
      line-height: 1.55;
    }

    .resource-next {
      margin-top: 8px;
      color: #334155;
      line-height: 1.55;
    }

    .card-actions {
      display: flex;
      align-items: start;
      gap: 8px;
    }

    .form {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .form-row {
      display: grid;
      gap: 7px;
    }

    .label {
      color: #334155;
      font-size: 13px;
      font-weight: 720;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 4px;
    }

    .message {
      min-height: 38px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f8fafc;
      color: var(--muted);
      line-height: 1.45;
    }

    .message.success {
      background: #ecfdf5;
      color: #047857;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: var(--muted);
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: #fbfdff;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .page {
        padding: 20px 14px 24px;
      }

      .header,
      .layout {
        grid-template-columns: 1fr;
        display: grid;
      }

      .status-card {
        max-width: none;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .resource-list {
        max-height: none;
        min-height: 360px;
      }

      .resource-card {
        grid-template-columns: 1fr;
      }

      .card-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1 class="title">Learning MCP Resources</h1>
        <p class="subtitle">维护 Spring AI Alibaba 学习资源，供 MiniMax Chat 的 Agent、Graph 和 MCP Client 调用。</p>
      </div>
      <section class="status-card" aria-live="polite">
        <div class="status-row">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">连接中</span>
        </div>
        <div id="statusDetail" class="status-detail">正在读取 MCP Server 状态。</div>
      </section>
    </header>

    <section class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">资源列表</h2>
          <div class="toolbar">
            <input id="searchInput" class="field" placeholder="搜索 Agent、Graph、MCP、Memory" autocomplete="off">
            <select id="topicFilter" class="select" aria-label="按主题筛选">
              <option value="">全部主题</option>
            </select>
            <button id="refreshButton" class="btn" type="button">刷新</button>
          </div>
        </div>
        <div id="resourceList" class="resource-list"></div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <h2 id="formTitle" class="panel-title">新增资源</h2>
          <button id="newButton" class="btn ghost" type="button">新建</button>
        </div>
        <form id="resourceForm" class="form">
          <div id="message" class="message">填写资源后保存，变更会写回 learning-resources.json。</div>
          <div class="form-row">
            <label class="label" for="idInput">资源 ID</label>
            <input id="idInput" class="field" required placeholder="例如 mcp-agent-roadmap" autocomplete="off">
          </div>
          <div class="form-row">
            <label class="label" for="topicInput">主题</label>
            <input id="topicInput" class="field" required placeholder="例如 Agent、Graph、MCP" autocomplete="off">
          </div>
          <div class="form-row">
            <label class="label" for="titleInput">标题</label>
            <input id="titleInput" class="field" required placeholder="资源标题" autocomplete="off">
          </div>
          <div class="form-row">
            <label class="label" for="summaryInput">摘要</label>
            <textarea id="summaryInput" class="textarea" required placeholder="这条资源解决什么学习问题"></textarea>
          </div>
          <div class="form-row">
            <label class="label" for="nextActionInput">下一步</label>
            <textarea id="nextActionInput" class="textarea" required placeholder="学习者接下来应该做什么"></textarea>
          </div>
          <div class="form-actions">
            <button id="saveButton" class="btn primary" type="submit">保存资源</button>
            <button id="deleteButton" class="btn danger" type="button">删除资源</button>
          </div>
        </form>
      </aside>
    </section>
  </main>

  <script>
    const apiBase = '/learning-mcp';
    const state = {
      resources: [],
      selectedId: '',
      mode: 'create'
    };

    const elements = {
      statusDot: document.querySelector('#statusDot'),
      statusText: document.querySelector('#statusText'),
      statusDetail: document.querySelector('#statusDetail'),
      searchInput: document.querySelector('#searchInput'),
      topicFilter: document.querySelector('#topicFilter'),
      refreshButton: document.querySelector('#refreshButton'),
      resourceList: document.querySelector('#resourceList'),
      formTitle: document.querySelector('#formTitle'),
      resourceForm: document.querySelector('#resourceForm'),
      message: document.querySelector('#message'),
      idInput: document.querySelector('#idInput'),
      topicInput: document.querySelector('#topicInput'),
      titleInput: document.querySelector('#titleInput'),
      summaryInput: document.querySelector('#summaryInput'),
      nextActionInput: document.querySelector('#nextActionInput'),
      newButton: document.querySelector('#newButton'),
      saveButton: document.querySelector('#saveButton'),
      deleteButton: document.querySelector('#deleteButton')
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        headers: {
          'Content-Type': 'application/json; charset=utf-8',
          ...(options.headers || {})
        },
        ...options
      });
      if (response.status === 204) {
        return null;
      }
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        const detail = data?.message || data?.error || response.statusText;
        throw new Error(detail);
      }
      return data;
    }

    async function loadHealth() {
      try {
        const health = await requestJson(`${apiBase}/health`);
        elements.statusDot.classList.add('online');
        elements.statusText.textContent = `${health.server} 已连接`;
        elements.statusDetail.textContent = `资源数 ${health.resourceCount}，来源 ${health.resourceSource}`;
      }
      catch (error) {
        elements.statusDot.classList.remove('online');
        elements.statusText.textContent = 'MCP Server 未连接';
        elements.statusDetail.textContent = error.message;
      }
    }

    async function loadResources() {
      const resources = await requestJson(`${apiBase}/resources`);
      state.resources = resources;
      renderTopicFilter();
      renderResources();
      await loadHealth();
    }

    function renderTopicFilter() {
      const selectedTopic = elements.topicFilter.value;
      const topics = [...new Set(state.resources.map(item => item.topic).filter(Boolean))].sort();
      elements.topicFilter.innerHTML = '<option value="">全部主题</option>' + topics
        .map(topic => `<option value="${escapeHtml(topic)}">${escapeHtml(topic)}</option>`)
        .join('');
      if (topics.includes(selectedTopic)) {
        elements.topicFilter.value = selectedTopic;
      }
    }

    function getFilteredResources() {
      const keyword = elements.searchInput.value.trim().toLowerCase();
      const topic = elements.topicFilter.value;
      return state.resources.filter(resource => {
        const text = [resource.id, resource.topic, resource.title, resource.summary, resource.nextAction]
          .join(' ')
          .toLowerCase();
        return (!topic || resource.topic === topic) && (!keyword || text.includes(keyword));
      });
    }

    function renderResources() {
      const resources = getFilteredResources();
      if (!resources.length) {
        elements.resourceList.innerHTML = '<div class="empty">暂无匹配资源<br>可以调整搜索条件，或在右侧新增一条资源。</div>';
        return;
      }
      elements.resourceList.innerHTML = resources.map(resource => `
        <article class="resource-card ${resource.id === state.selectedId ? 'active' : ''}">
          <div class="resource-main">
            <div class="resource-title">
              <strong>${escapeHtml(resource.title)}</strong>
              <span class="tag">${escapeHtml(resource.topic)}</span>
            </div>
            <div class="resource-id">${escapeHtml(resource.id)}</div>
            <p class="resource-text">${escapeHtml(resource.summary)}</p>
            <p class="resource-next"><strong>下一步：</strong>${escapeHtml(resource.nextAction)}</p>
          </div>
          <div class="card-actions">
            <button class="btn" type="button" data-action="edit" data-id="${escapeHtml(resource.id)}">编辑</button>
          </div>
        </article>
      `).join('');
    }

    function setMessage(text, type = '') {
      elements.message.className = `message ${type}`.trim();
      elements.message.textContent = text;
    }

    function resetForm() {
      state.mode = 'create';
      state.selectedId = '';
      elements.formTitle.textContent = '新增资源';
      elements.idInput.disabled = false;
      elements.resourceForm.reset();
      elements.deleteButton.disabled = true;
      setMessage('填写资源后保存，变更会写回 learning-resources.json。');
      renderResources();
    }

    function fillForm(resource) {
      state.mode = 'edit';
      state.selectedId = resource.id;
      elements.formTitle.textContent = '编辑资源';
      elements.idInput.value = resource.id;
      elements.idInput.disabled = true;
      elements.topicInput.value = resource.topic;
      elements.titleInput.value = resource.title;
      elements.summaryInput.value = resource.summary;
      elements.nextActionInput.value = resource.nextAction;
      elements.deleteButton.disabled = false;
      setMessage(`正在编辑 ${resource.id}`);
      renderResources();
    }

    function readForm() {
      return {
        id: elements.idInput.value.trim(),
        topic: elements.topicInput.value.trim(),
        title: elements.titleInput.value.trim(),
        summary: elements.summaryInput.value.trim(),
        nextAction: elements.nextActionInput.value.trim()
      };
    }

    async function saveResource(event) {
      event.preventDefault();
      const payload = readForm();
      try {
        if (state.mode === 'edit') {
          const updated = await requestJson(`${apiBase}/resources/${encodeURIComponent(state.selectedId)}`, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          setMessage(`已更新资源：${updated.id}`, 'success');
          await loadResources();
          fillForm(updated);
          return;
        }

        const created = await requestJson(`${apiBase}/resources`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        setMessage(`已新增资源：${created.id}`, 'success');
        await loadResources();
        fillForm(created);
      }
      catch (error) {
        setMessage(error.message, 'error');
      }
    }

    async function deleteResource() {
      if (!state.selectedId) {
        return;
      }
      const confirmed = window.confirm(`确认删除资源 ${state.selectedId}？`);
      if (!confirmed) {
        return;
      }
      try {
        await requestJson(`${apiBase}/resources/${encodeURIComponent(state.selectedId)}`, {
          method: 'DELETE'
        });
        resetForm();
        await loadResources();
        setMessage('资源已删除，并已写回 JSON。', 'success');
      }
      catch (error) {
        setMessage(error.message, 'error');
      }
    }

    elements.resourceList.addEventListener('click', event => {
      const button = event.target.closest('button[data-action="edit"]');
      if (!button) {
        return;
      }
      const resource = state.resources.find(item => item.id === button.dataset.id);
      if (resource) {
        fillForm(resource);
      }
    });

    elements.resourceForm.addEventListener('submit', saveResource);
    elements.deleteButton.addEventListener('click', deleteResource);
    elements.newButton.addEventListener('click', resetForm);
    elements.refreshButton.addEventListener('click', async () => {
      await loadResources();
      setMessage('资源列表已刷新。', 'success');
    });
    elements.searchInput.addEventListener('input', renderResources);
    elements.topicFilter.addEventListener('change', renderResources);

    resetForm();
    loadResources().catch(error => setMessage(error.message, 'error'));
  </script>
</body>
</html>
