server:
  port: 8080
minimax:
  dashboard:
    auth:
      # 本地学习默认关闭；上线前设置 MINIMAX_DASHBOARD_AUTH_ENABLED=true 并配置 MINIMAX_DASHBOARD_TOKEN。
      enabled: ${MINIMAX_DASHBOARD_AUTH_ENABLED:false}
      token: ${MINIMAX_DASHBOARD_TOKEN:}
  customer:
    context:
      # 默认关闭 Redis 短期上下文；开启 redis profile 后会把多轮对话上下文写入 Redis。
      redis-enabled: false
      redis-prefix: minimax:customer:conversation
      max-messages: 20
      redis-ttl-seconds: 43200
    memory:
      # Memory 已迁移到 MySQL 数据库表 customer_memory；旧 file 配置仅保留给历史数据排查。
      file: spring-ai-alibaba-chat-example/minimax-chat/memory/customer-memory.json
    rag:
      # false：使用本地高召回关键词知识库；true：如果存在 Spring AI VectorStore Bean，则写入并使用真实向量库。
      vector-enabled: false
      knowledge-file: spring-ai-alibaba-chat-example/minimax-chat/memory/customer-knowledge.json
      # 真实向量库建议使用 PGVector / Milvus。当前模块只做 VectorStore 适配边界，不强依赖外部服务。
      backend: local
spring:
  application:
    name: minimax-chat-example
  datasource:
    url: jdbc:mysql://localhost:3306/minimax_customer_service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.minimaxi.com
      api-key: ${MINIMAX_API_KEY}
      chat:
        options:
          model: MiniMax-M2.7
          temperature: 0.7
    mcp:
      client:
        # 默认关闭真实 MCP Client，保证 minimax-chat 不依赖外部 MCP Server 也能启动。
        # 要测试真实 MCP 时改为 true，并启动对应的 MCP Server。
        enabled: false
        name: minimax-customer-service-mcp-client
        version: 1.0.0
        request-timeout: 30s
        type: ASYNC
        sse:
          connections:
            customer:
              # 对应 minimax-customer-mcp-server；未启动时 CustomerMcpService 会回退本地 Mock 数据。
              url: http://localhost:19001
